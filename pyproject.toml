[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dead-reckoning"
version = "0.1.0"
description = "AI/ML Intelligent Dead Reckoning System for Seamless Navigation (SIH PS 26168)"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pyquaternion>=0.9.9",
]

[project.optional-dependencies]
ml = [
    "torch>=2.0",
    "onnxruntime>=1.15",
]
viz = [
    "matplotlib>=3.7",
    "plotly>=5.15",
]
web = [
    "fastapi>=0.100",
    "uvicorn>=0.23",
    "websockets>=11.0",
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1",
]
all = [
    "dead-reckoning[ml,viz,web,dev]",
]

[tool.setuptools.packages.find]
include = ["core*", "tools*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks integration tests",
    "requires_data: marks tests needing dataset files",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM"]
