# Dead Reckoning System — Default Configuration
# All values in SI units unless otherwise noted.

system:
  output_rate_hz: 10
  coordinate_frame: "NED"  # NED or ENU
  log_level: "INFO"

sensors:
  imu:
    rate_hz: 100
    accel_noise_density: 0.004    # m/s^2/sqrt(Hz)  — typical smartphone MEMS
    gyro_noise_density: 0.0005    # rad/s/sqrt(Hz)
    accel_bias_instability: 0.05  # m/s^2
    gyro_bias_instability: 0.001  # rad/s
    accel_range: 156.96           # m/s^2 (16g)
    gyro_range: 34.91             # rad/s (~2000 deg/s)
  magnetometer:
    rate_hz: 50
    noise_density: 0.5            # uT/sqrt(Hz)
    reference_field_norm: 48.0    # uT — approximate for India
    anomaly_threshold: 10.0       # uT — deviation from reference
  barometer:
    rate_hz: 20
    noise: 0.5                    # Pa
    floor_height: 3.0             # meters — typical building floor
  gnss:
    rate_hz: 1
    min_satellites: 4
    max_hdop: 5.0
    max_speed_accuracy: 0.5       # m/s

calibration:
  static_duration_s: 5.0          # seconds of static data for bias estimation
  mag_calibration_samples: 500
  temperature_compensation: false

alignment:
  gravity_averaging_s: 2.0
  min_speed_for_heading: 3.0      # m/s — minimum speed for GNSS heading alignment
  min_acceleration_for_forward: 0.5  # m/s^2 — minimum longitudinal accel for yaw
  reorientation_angular_rate_threshold: 2.0  # rad/s
  confidence_decay_rate: 0.01     # per second without update

eskf:
  state_dim: 15
  # Process noise spectral densities
  accel_noise_psd: 0.01          # (m/s^2)^2 * s
  gyro_noise_psd: 0.0001         # (rad/s)^2 * s
  accel_bias_psd: 0.0001         # (m/s^2)^2 / s
  gyro_bias_psd: 0.00001         # (rad/s)^2 / s
  # Initial uncertainties (1-sigma)
  init_position_std: 1.0          # meters
  init_velocity_std: 0.1          # m/s
  init_attitude_std: 0.1          # radians (~5.7 deg)
  init_accel_bias_std: 0.1        # m/s^2
  init_gyro_bias_std: 0.01        # rad/s

zupt:
  base_velocity_std: 0.01         # m/s — when fully stationary
  stationary_prob_threshold: 0.5  # minimum P(stat) to apply ZUPT
  confidence_exponent: 2.0        # gamma in R_zupt scaling
  min_duration_s: 0.3             # minimum stationary duration to trigger

nhc:
  car:
    lateral_std: 0.05             # m/s
    vertical_std: 0.1             # m/s
  motorcycle:
    lateral_std_base: 0.1         # m/s — relaxed for lean
    vertical_std: 0.15            # m/s
    lean_scaling_kappa1: 2.0
    yaw_rate_scaling_kappa2: 0.5
  scooter:
    lateral_std_base: 0.08        # m/s
    vertical_std: 0.12            # m/s
    lean_scaling_kappa1: 1.5
    yaw_rate_scaling_kappa2: 0.3

gnss_integrity:
  innovation_gate_chi2: 9.21      # chi-squared threshold (3 DOF, 97.5%)
  max_position_jump: 50.0         # meters — reject GNSS beyond this
  recovery_ramp_duration_s: 3.0   # smooth transition time

magnetic:
  reliability_high: 0.8           # above this: use compass
  reliability_low: 0.3            # below this: reject compass
  heading_noise_std_reliable: 0.1 # rad (~5.7 deg) — when reliable
  heading_noise_std_unreliable: 3.14  # effectively infinite — when unreliable

integrity:
  high_confidence_position_std: 5.0     # meters
  moderate_confidence_position_std: 20.0
  degraded_confidence_position_std: 50.0
  # Beyond degraded → UNRELIABLE

vehicle_classifier:
  window_size: 200                # samples
  confidence_threshold: 0.7       # below this: use conservative constraints
  default_class: "UNKNOWN"

vibration:
  fft_window_size: 256
  fft_hop_size: 64
  engine_band_hz: [10.0, 30.0]
  motion_band_hz: [0.0, 5.0]
  high_vibration_threshold: 0.7   # normalized spectral energy ratio

replay:
  default_speed: 1.0
  max_speed: 20.0
  log_format: "csv"               # csv or msgpack
